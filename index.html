<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brasil das Diferenças</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <div class="nuvem nuvem1"></div>
    <div class="nuvem nuvem2"></div>
    <div class="nuvem nuvem3"></div>

    <main>

        <!-- LOGIN -->
        <section id="loginTela" class="card">

            <div class="bandeira">★</div>

            <h1>BRASIL DAS DIFERENÇAS</h1>

            <p class="subtitulo">
                O FUTURO COMEÇA COM AS ESCOLHAS DE HOJE
            </p>

            <div class="pixel-box">

                <input
                    id="email"
                    type="email"
                    placeholder="E-MAIL"
                >

                <input
                    id="senha"
                    type="password"
                    placeholder="SENHA"
                >

            </div>

            <button
                class="pixel-btn"
                onclick="entrar()"
            >
                ▶ ENTRAR
            </button>

            <p id="erro"></p>

        </section>


        <!-- CRIAR SENHA APÓS CONVITE -->
        <section id="senhaTela" class="card escondido">

            <div class="bandeira">★</div>

            <h1>CRIE SUA SENHA</h1>

            <p class="subtitulo">
                CRIE UMA SENHA PARA ACESSAR O PORTAL
            </p>

            <div class="pixel-box">

                <input
                    id="novaSenha"
                    type="password"
                    placeholder="NOVA SENHA"
                >

                <input
                    id="confirmarSenha"
                    type="password"
                    placeholder="CONFIRME A SENHA"
                >

            </div>

            <button
                class="pixel-btn"
                onclick="definirSenha()"
            >
                ✓ CRIAR SENHA
            </button>

            <p id="erroSenha" class="subtitulo"></p>

        </section>


        <!-- PORTAL -->
        <section id="portalTela" class="card escondido">

            <div class="bandeira">★</div>

            <h1>BRASIL DAS DIFERENÇAS</h1>

            <p class="subtitulo">
                ÁREA DO PROFESSOR
            </p>

            <div class="pixel-box">

                <p>👤 ACESSO LIBERADO</p>

                <p>🎮 VERSÃO: 1.0</p>

                <p>✅ STATUS: ATIVO</p>

            </div>


            <a
                class="pixel-btn download"
                href="BrasilDasDiferencas-Windows.zip"
                download
            >
                ⬇ BAIXAR JOGO
            </a>


            <div class="pixel-box atualizacao">

                <h3>ÚLTIMA ATUALIZAÇÃO</h3>

                <p>
                    BRASIL DAS DIFERENÇAS - VERSÃO 1.0
                </p>

            </div>


            <button
                class="pixel-btn sair"
                onclick="sair()"
            >
                SAIR
            </button>

        </section>

    </main>

    <div class="grama"></div>

    <script src="script.js"></script>

</body>
</html>
